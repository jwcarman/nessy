# What the Nessy engine needs from Pekko, so an application does not have to know.
#
# reference.conf, not application.conf: everything here is a DEFAULT that an
# application's own configuration overrides in the ordinary way.

pekko {
  actor {
    # The engine always shards, so a plain local actor system will not start it.
    provider = "cluster"

    serializers {
      # Ours. pekko-serialization-jackson is deliberately absent, so Pekko has no
      # opinion about the jackson-databind version anything else on the classpath
      # wants.
      nessy-state = "org.jwcarman.nessy.engine.StateSerializer"
    }

    serialization-bindings {
      # Erasure works in our favour here: this one line covers every AgentState<O>.
      "org.jwcarman.nessy.engine.AgentState" = nessy-state
      "org.jwcarman.nessy.engine.TurnState" = nessy-state
    }
  }

  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 0
  }

  cluster {
    # A single node is the default shape: nothing else is joining, so waiting for a
    # quorum would be waiting forever. An application running a real cluster sets
    # seed-nodes and raises this, and the starter then stops self-joining.
    min-nr-of-members = 1
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
}

# NOTE: pekko.persistence.state.plugin is deliberately NOT set here.
#
# The engine keeps agent and turn state in Pekko's durable-state store, which is a
# SEPARATE store from the Nessy Substrate that holds transcripts and claims. There is
# no default that is right for everyone — an application picks a durable-state plugin
# and configures it, exactly as it picks a DataSource. Starting without one fails at
# the first turn rather than silently losing state.
