# A cluster of one, in memory.
#
# Sharding is not optional in this engine, so every test runs a real cluster -- there is no
# local-routing mode to fall back to, and a test that skipped clustering would be exercising a
# configuration that never ships. The cost is remoting and a join; the benefit is that tests fail
# where production would.
#
# Port 0 lets the OS pick, which means seed-nodes cannot be written down here -- the address is not
# known until the system is up. Tests join the node to itself programmatically instead; see
# ClusterOfOne.
pekko {
  loglevel = "WARNING"

  actor {
    provider = "cluster"

    serializers {
      # Ours. pekko-serialization-jackson is deliberately absent, so Pekko has no opinion about the
      # jackson-databind version anything else on the classpath wants.
      nessy-state = "org.jwcarman.nessy.engine.StateSerializer"
    }

    serialization-bindings {
      # One line, one type: the observation type stopped at the backlog store.
      "org.jwcarman.nessy.engine.agent.AgentState" = nessy-state
    }
  }

  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 0
  }

  cluster {
    # Nothing else is ever joining, so waiting for a quorum is waiting forever.
    min-nr-of-members = 1
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }

  persistence {
    state.plugin = "pekko.persistence.testkit.state"
    testkit.state.class = "org.apache.pekko.persistence.testkit.state.PersistenceTestKitDurableStateStoreProvider"
  }

  coordinated-shutdown.run-by-jvm-shutdown-hook = off
}
