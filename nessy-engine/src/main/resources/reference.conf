# Defaults the engine needs from Pekko, shipped by the engine itself so an application does not have
# to know them. reference.conf, not application.conf: everything here is a DEFAULT that an
# application's own configuration overrides in the ordinary way, and Pekko merges every
# reference.conf on the classpath.

# There is deliberately no dispatcher here any more.
#
# There used to be a nessy.turn-dispatcher: a 32-thread pool with throughput = 1, so that turn
# actors doing blocking store calls could not starve cluster sharding and gossip. It was the right
# containment for actors that blocked, and turn actors no longer exist.
#
# An agent now does no blocking work on its own thread at all. Claims, the transcript, alarms, model
# calls, tools and approvers all run on the engine's blocking executor — virtual threads by default,
# settable through EngineConfig.blocking — and every answer comes back as a message. So the pool
# that mattered is that executor's, configured in Java where the rest of the engine is configured,
# and a Pekko dispatcher nobody selects would only document a guarantee nothing implements.
