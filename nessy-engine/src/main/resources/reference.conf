# Defaults the engine needs from Pekko, shipped by the engine itself so an application does not have
# to know them. reference.conf, not application.conf: everything here is a DEFAULT that an
# application's own configuration overrides in the ordinary way, and Pekko merges every
# reference.conf on the classpath.

nessy {
  # Turn actors run here, not on the default dispatcher.
  #
  # A turn does blocking work on its own thread: claims are written and memory is read inside
  # command handlers, and an application's Memory implementation is arbitrary code that may do IO of
  # its own. Blocking the DEFAULT dispatcher would starve cluster sharding, gossip and narration
  # along with it — so turns get a pool of their own, and the failure mode of slow storage becomes
  # "turns queue" rather than "the node stops answering".
  #
  # Deliberately NOT pekko.actor.default-blocking-io-dispatcher: Pekko shares that one with its own
  # file IO and DNS, and a pool sized for our storage should not be competing with the runtime's.
  #
  # throughput = 1 because these are blocking actors: batching messages to one thread only makes the
  # others wait longer.
  turn-dispatcher {
    type = "Dispatcher"
    executor = "thread-pool-executor"
    throughput = 1

    thread-pool-executor {
      # The number of turns that may be inside a blocking store call at once. Raise it if turns
      # queue behind storage; the cost of each idle thread is a stack, not a connection.
      fixed-pool-size = 32
    }
  }
}
