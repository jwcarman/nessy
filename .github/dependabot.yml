version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    reviewers:
      - "jwcarman"
    groups:
      # The model SDKs move together and break in the same place: one adapter each, all covered
      # by tests that use the real SDK types against a fake transport. Grouped so a week's
      # vendor churn is one review rather than four.
      model-providers:
        patterns:
          - "com.openai*"
          - "com.anthropic*"
          - "com.google.genai*"
          - "software.amazon.awssdk*"
        update-types:
          - "minor"
          - "patch"
      spring:
        patterns:
          - "org.springframework*"
        update-types:
          - "minor"
          - "patch"
      serialization:
        patterns:
          - "tools.jackson*"
          - "com.fasterxml*"
        update-types:
          - "minor"
          - "patch"
      observability:
        patterns:
          - "io.micrometer*"
          - "io.opentelemetry*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.awaitility*"
          - "org.testcontainers*"
        update-types:
          - "minor"
          - "patch"
      build-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "org.jacoco*"
          - "org.sonarsource*"
          - "com.diffplug.spotless*"
          - "com.mycila*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "jwcarman"
