name: CI with Maven

on:
  # Keeps the SonarCloud token alive. A token is "never expires, if used", so a project that goes
  # quiet for a month loses it and every build after that fails on a credential nobody revoked.
  # Twice a month leaves plenty of margin against that.
  schedule:
    - cron: '0 9 1,15 * *'
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # Formatting and licence headers, before anything is compiled. Both are validate-phase goals,
  # so this is seconds of work, and failing it here means the answer is one command rather than
  # a scroll through a build log.
  check:
    name: Formatting and licence headers
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    - name: Check formatting and licence headers
      run: mvn -B spotless:check license:check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    - name: Build with Maven
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # One build, analysed in place — the same job shape substrate, codec, odyssey,
      # continuum and accent use. Dependabot-triggered workflows cannot see repository
      # secrets, so the SonarCloud goal only runs when a token is present.
      #
      # And the build WAITS on the gate. Without that, this job goes green while the gate goes
      # red and the only way to find out is to visit the website -- which is how this project
      # sat at reliability D on an assertion that could never fail, uploaded and read by nobody.
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          mvn -Pci -B verify sonar:sonar -Dsonar.qualitygate.wait=true -Dnessy.excludedGroups=live
        else
          mvn -Pci -B verify -Dnessy.excludedGroups=live
        fi
