name: CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    - name: Build with Maven
      run: mvn -B verify -Dnessy.excludedGroups=live

    - name: Verify hello's five-minute promise runs for real
      run: |
        ./mvnw -q -pl nessy-examples/hello -am compile exec:java | tee hello-output.txt
        grep -q "The answer is 4. (COMPLETE)" hello-output.txt

    - name: Verify release profile (javadoc, sources, signing skipped)
      run: mvn -B -P release -DskipTests -Dgpg.skip=true verify

  sonar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    - name: Build and analyze with SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -Pci -B verify sonar:sonar -Dnessy.excludedGroups=live
