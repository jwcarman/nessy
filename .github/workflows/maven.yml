name: CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    - name: Build with Maven
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # One build, analysed in place — the same job shape substrate, codec, odyssey,
      # continuum and accent use. Dependabot-triggered workflows cannot see repository
      # secrets, so the SonarCloud goal only runs when a token is present.
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          mvn -Pci -B verify sonar:sonar -Dnessy.excludedGroups=live,vendor
        else
          mvn -Pci -B verify -Dnessy.excludedGroups=live,vendor
        fi
