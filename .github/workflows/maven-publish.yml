name: Publish package to the Maven Central Repository
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Maven Central Repository
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'liberica'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # processAllModules, because nessy-bom deliberately has no <parent> and versions:set
      # otherwise walks only the modules inheritance reaches. Left out, the bom keeps its
      # -SNAPSHOT version, routes to the snapshot repository, and the whole deployment is
      # refused with a 403 -- which is how the 0.1.0 cut first failed. Substrate hit the same
      # thing for the same reason.
      #
      # The tag arrives through the environment rather than being interpolated into the script.
      # A release name is chosen by whoever cuts the release, and a value spliced straight into
      # a shell command is a command anyone able to cut one gets to run on this job -- which
      # holds the signing key and the Central token.
      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          ./mvnw versions:set
          -DnewVersion="$RELEASE_TAG"
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Publish package
        run: ./mvnw -P release --batch-mode deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
