# The starter's own tests need a durable-state plugin, which reference.conf
# deliberately leaves for the application to choose. The testkit's is the right one
# here: these tests are about what Spring wires, not about where state lands.
pekko.persistence {
  state.plugin = "pekko.persistence.testkit.state"
  testkit.state.class = "org.apache.pekko.persistence.testkit.state.PersistenceTestKitDurableStateStoreProvider"
}
pekko.loglevel = "WARNING"
pekko.coordinated-shutdown.run-by-jvm-shutdown-hook = off
