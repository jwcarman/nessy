# What the engine needs from Pekko for a console application, so a main method does not have to
# know. reference.conf, not application.conf: everything here is a DEFAULT that an application's
# own configuration overrides in the ordinary way.

pekko {
  # A terminal is this application's output. Pekko narrating its own startup over the top of a
  # conversation is noise, so the floor is WARNING rather than INFO.
  loglevel = "WARNING"

  actor {
    # The engine always shards, so even one node has to be a cluster.
    provider = "cluster"
    serializers { nessy-state = "org.jwcarman.nessy.engine.StateSerializer" }
    serialization-bindings {
      "org.jwcarman.nessy.engine.agent.AgentState" = nessy-state
    }
  }

  remote.artery.canonical { hostname = "127.0.0.1", port = 0 }

  cluster {
    min-nr-of-members = 1
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }

  # In memory, for exactly as long as this process. The engine ships no default here on purpose,
  # because no default is right for everyone — but for a REPL there IS a right answer, and this is
  # it: a conversation typed into a terminal has no reason to outlive the terminal.
  persistence {
    state.plugin = "pekko.persistence.testkit.state"
    testkit.state.class = "org.apache.pekko.persistence.testkit.state.PersistenceTestKitDurableStateStoreProvider"
  }

  coordinated-shutdown.run-by-jvm-shutdown-hook = off
}
