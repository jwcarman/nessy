# THROWAWAY SPIKE, TIER 2. Everything the cluster tier adds on top of spike-common.conf.
#
# THIS FILE IS THE COST OF THE UPGRADE PATH, in full. Tier 1 needs none of it.

include "spike-common"

pekko {
  actor.provider = "cluster"

  # Remoting is mandatory under the cluster provider, single node or not. Port 0 = ephemeral,
  # which is fine because the node joins itself (see ShardedSpikeRuntime) rather than using
  # seed-nodes.
  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 0
  }

  cluster {
    min-nr-of-members = 1
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"

    sharding {
      # Tier 2's answer to "who re-drives a stalled turn". Tier 1 answers it with SpikeSweep,
      # which wakes only UNFINISHED turns instead of every entity ever remembered.
      remember-entities = on
      remember-entities-store = eventsourced
      journal-plugin-id = ${pekko.persistence.journal.plugin}
      snapshot-plugin-id = ${pekko.persistence.snapshot-store.plugin}
    }
  }
}
