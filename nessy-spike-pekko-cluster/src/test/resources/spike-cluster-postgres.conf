# THROWAWAY SPIKE, TIER 2 on Postgres. Identical to tier 1's spike-postgres.conf except for
# the include: the cluster tier layers sharding and remoting over the same persistence setup.
#
# Compare with spike-inmemory.conf. Both include spike-common.conf and name persistence plugins.
# The DDL is ours to own (pekko-spike-schema.sql); the plugin creates nothing.
include "spike-cluster-common"

pekko.persistence {
  journal.plugin = "jdbc-journal"
  snapshot-store.plugin = "jdbc-snapshot-store"
  state.plugin = "jdbc-durable-state-store"
}

jdbc-journal.use-shared-db = "spike"
jdbc-snapshot-store.use-shared-db = "spike"
jdbc-durable-state-store.use-shared-db = "spike"

pekko-persistence-jdbc {
  shared-databases {
    spike {
      profile = "slick.jdbc.PostgresProfile$"
      db {
        connectionPool = "HikariCP"
        driver = "org.postgresql.Driver"
        # currentSchema keeps every unqualified table name inside pekko_spike, so the spike
        # cannot see -- let alone write -- the watchman tables sitting in public.
        url = "jdbc:postgresql://localhost:5432/watchman?reWriteBatchedInserts=true&currentSchema=pekko_spike"
        user = "watchman"
        password = "watchman"
        numThreads = 5
        maxConnections = 5
        minConnections = 1
      }
    }
  }
}
