# THROWAWAY SPIKE.
#
# Everything BOTH tiers share, MINUS the choice of persistence plugin and MINUS the choice of
# runtime. Compare this file with round 1's version of it: the cluster block, the remoting block,
# the split-brain-resolver, the seed-node handling, the remember-entities settings and the
# serialization-module wiring have ALL gone. What is left is the actor system and one serializer
# that is ours.

pekko {
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    # TIER 1 DEFAULT. The cluster module overrides this to `cluster`, and that override plus a
    # remoting block is the whole of the difference at the config level.
    provider = "local"

    serializers {
      # OURS. Not pekko-serialization-jackson, which is not even on tier 1's classpath.
      spike-state = "org.jwcarman.nessy.spike.pekko.SpikeStateSerializer"
    }

    serialization-bindings {
      # Only the durable STATE is ever serialized. Commands stay in-process on a single node, and
      # are local messages even in the sharded tier, so they need no binding.
      "org.jwcarman.nessy.spike.pekko.SpikeTurnState" = spike-state
    }
  }
}
