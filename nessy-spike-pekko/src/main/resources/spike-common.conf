# THROWAWAY SPIKE.
#
# Everything a process needs in order to host sharded, durable agents, MINUS the choice of
# persistence plugin. That choice is the ONLY difference between phase 1 (in memory) and
# phase 2 (Postgres): see spike-inmemory.conf and spike-postgres.conf, which both include
# this file and add nothing but plugin ids and a datasource.
#
# This is also the honest answer to "what does a Spring Boot app have to grow?" — all of it.

pekko {
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    # Cluster Sharding needs the cluster provider even on one node.
    provider = "cluster"

    serialization-bindings {
      # One marker interface registers every command and every state record.
      "org.jwcarman.nessy.spike.pekko.SpikeSerializable" = jackson-json
    }
  }

  # Remoting is mandatory under the cluster provider, single node or not. Port 0 = ephemeral,
  # which is fine because the node joins itself (see SpikeCluster) rather than using seed-nodes.
  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 0
  }

  cluster {
    # A single node forming a cluster of one still trips the "don't run a majority-less cluster"
    # guard rails unless it is told it is alone on purpose.
    min-nr-of-members = 1
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"

    sharding {
      # The brief's requirement: entities are remembered across restarts, and remembered in the
      # JOURNAL rather than in distributed data, because ddata loses them on a full cluster
      # shutdown -- which is exactly the case the restart test exercises.
      remember-entities = on
      remember-entities-store = eventsourced

      # The remember-entities journal follows whichever plugin the phase chose.
      journal-plugin-id = ${pekko.persistence.journal.plugin}
      snapshot-plugin-id = ${pekko.persistence.snapshot-store.plugin}
    }
  }

  # NOTE: the JacksonObjectMapperFactory seam is NOT configurable. There is no
  # pekko.serialization.jackson.*.object-mapper-factory key; the only way in is
  # JacksonObjectMapperProviderSetup inside an ActorSystemSetup, i.e. Java code.
  # See SpikeCluster.
}
