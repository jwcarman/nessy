# THROWAWAY SPIKE -- PHASE 2: the SAME flow, made durable, by CONFIG ALONE.
#
# Compare with spike-inmemory.conf. Both include spike-common.conf and both do exactly one thing:
# name the persistence plugins. Everything below the plugin ids is datasource plumbing that
# pekko-persistence-jdbc requires; none of it is visible to a single line of Java in this module.
#
# The DDL is ours to own -- see pekko-spike-schema.sql. The plugin creates nothing.

include "spike-common"

pekko.persistence {
  journal.plugin = "jdbc-journal"
  snapshot-store.plugin = "jdbc-snapshot-store"
  state.plugin = "jdbc-durable-state-store"
}

jdbc-journal.use-shared-db = "spike"
jdbc-snapshot-store.use-shared-db = "spike"
jdbc-durable-state-store.use-shared-db = "spike"

pekko-persistence-jdbc {
  shared-databases {
    spike {
      profile = "slick.jdbc.PostgresProfile$"
      db {
        connectionPool = "HikariCP"
        driver = "org.postgresql.Driver"
        # currentSchema keeps every unqualified table name inside pekko_spike, so the spike
        # cannot see -- let alone write -- the watchman tables sitting in public.
        url = "jdbc:postgresql://localhost:5432/watchman?reWriteBatchedInserts=true&currentSchema=pekko_spike"
        user = "watchman"
        password = "watchman"
        numThreads = 5
        maxConnections = 5
        minConnections = 1
      }
    }
  }
}
