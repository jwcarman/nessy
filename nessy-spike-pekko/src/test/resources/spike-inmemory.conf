# THROWAWAY SPIKE -- PHASE 1: prove the FLOW, with nothing external.
#
# The entire difference from phase 2 is below this line: three plugin ids. No Docker, no
# datasource, no DDL. If phase 2 needs anything from Java code that phase 1 did not, the
# "code to Pekko's API, let the modules own durability" principle is false.

include "spike-common"

pekko.persistence {
  journal.plugin = "pekko.persistence.testkit.journal"
  snapshot-store.plugin = "pekko.persistence.testkit.snapshotstore"
  state.plugin = "pekko.persistence.testkit.state"
}

# pekko-persistence-testkit ships the durable-state provider in its reference.conf but NOT the
# journal or snapshot plugin classes -- those are handed out by PersistenceTestKitPlugin.config()
# in Scala. Naming them here keeps the swap purely declarative.
pekko.persistence.testkit.journal {
  class = "org.apache.pekko.persistence.testkit.PersistenceTestKitPlugin"
}
pekko.persistence.testkit.snapshotstore {
  class = "org.apache.pekko.persistence.testkit.PersistenceTestKitSnapshotPlugin"
}
