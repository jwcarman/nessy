site_name: Nessy
site_description: An agent harness framework for Java.
site_url: https://jwcarman.github.io/nessy/
repo_url: https://github.com/jwcarman/nessy
repo_name: jwcarman/nessy
edit_uri: edit/main/docs/

docs_dir: docs

# Nessy's process artifacts (specs, plans) live under docs/superpowers and
# stay out of the published site.
exclude_docs: |
  /superpowers/

theme:
  name: material
  logo: assets/brand/nessy-mark.png
  favicon: assets/brand/favicon.ico
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  # Nessy brand palette — defined in docs/assets/stylesheets/nessy.css
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/nessy.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Concepts:
      - Agent as Scope: concepts/agent-as-scope.md
      - The Tiers: concepts/the-four-tiers.md
      - Durable Computation: concepts/durable-computation.md
      - Tools: concepts/tools.md
      - Authorization: concepts/authorization.md
      - Intent: concepts/intent.md
      - Memory: concepts/memory.md
      - Storage: concepts/storage.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Harness: guides/harness.md
      - Providers: guides/providers.md
      - MCP Clients: guides/mcp-clients.md
      - Observability: guides/observability.md
  - Reference:
      - Changelog: https://github.com/jwcarman/nessy/blob/main/CHANGELOG.md
      - Javadoc (source): https://github.com/jwcarman/nessy
