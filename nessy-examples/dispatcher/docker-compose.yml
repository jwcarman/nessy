services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nessy
      POSTGRES_USER: nessy
      POSTGRES_PASSWORD: nessy
    # Host 5434, not the usual 5432: this module has no hardcoded coordinates
    # anywhere — Boot's service connections read the actual mapping — so it
    # can coexist with chat-web's stack (which owns host 5432 by its
    # explicit datasource url) and order-desk's stack (host 5433) instead of
    # fighting either. A live port collision between the stacks during the
    # build proved the need.
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessy"]
      interval: 2s
      timeout: 2s
      retries: 15
