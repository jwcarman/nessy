server:
  port: 8081

spring:
  application:
    name: nessy-dispatcher
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      # start-only: the containers outlive app exits, so only the first-ever run pays the cold
      # start — and the kill-and-restart demo (spec §5) keeps its database.
      lifecycle-management: start-only
  # No datasource coordinates here — Boot's service connections detect the container from
  # docker-compose.yml and wire them in (spec §4).
