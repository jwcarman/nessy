# What chat-web needs that is not chat-web: its database, and somewhere to send traces.
#
# `docker compose up -d` beside this file, then run the example. The credentials are the ones
# application.yml defaults to, so nothing needs exporting.
services:
  postgres:
    image: postgres:17
    container_name: chat-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nessy
      POSTGRES_USER: nessy
      POSTGRES_PASSWORD: nessy
    ports:
      - "5432:5432"
    volumes:
      - chat-web-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessy -d nessy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Grafana's own all-in-one: Grafana, Prometheus, Tempo and Loki behind one OTLP endpoint.
  lgtm:
    image: grafana/otel-lgtm
    container_name: chat-web-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP, where application.yml sends traces
    volumes:
      - chat-web-lgtm:/data

volumes:
  chat-web-db:
  chat-web-lgtm:
