services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nessy
      POSTGRES_USER: nessy
      POSTGRES_PASSWORD: nessy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessy"]
      interval: 2s
      timeout: 2s
      retries: 15

  # OTel Collector + Tempo + Prometheus + Loki + Grafana in one demo image
  # (Grafana ships it for local dev, explicitly not production). All three
  # OTLP signals land on 4318; Grafana UI on 3000.
  otel-lgtm:
    image: grafana/otel-lgtm:0.29.2
    ports:
      - "3000:3000"
      - "4318:4318"
      - "4317:4317"
    labels:
      # Boot must not gate app startup on the whole Grafana stack coming up —
      # the OTLP exporters retry until it appears; compose still starts it.
      org.springframework.boot.ignore: true
    # The image's own healthcheck polls every 30s, so a cold pull can sit
    # "starting" for up to 30s before its first probe even fires — and Boot's
    # compose `up --wait` gates on container health regardless of the
    # ignore label above (that label only excuses the app from wiring a
    # service connection to it, not compose from waiting on it). Same probe
    # script, a much shorter leash.
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 60
