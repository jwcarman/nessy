<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nessy Chat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Nessy Chat</h1>
      <button id="new-chat" type="button">New chat</button>
    </header>
    <main id="log"></main>
    <section id="approvals"></section>
    <footer>
      <form id="send-form">
        <input id="text" type="text" placeholder="Say something…" autocomplete="off" />
        <button id="send" type="submit">Send</button>
      </form>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
