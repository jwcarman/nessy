# The one thing the starter's reference.conf deliberately leaves unset: WHERE agent and turn state
# is kept. There is no default that is right for everyone, so every application answers this.
#
# This example answers it with Pekko's in-memory store, which is a real answer for a demo and the
# wrong one for anything else: an agent mid-turn when the process stops does not resume. The
# watchman example next door answers it with Postgres, which is what a deployment does.
pekko.persistence {
  state.plugin = "pekko.persistence.testkit.state"
  testkit.state.class = "org.apache.pekko.persistence.testkit.state.PersistenceTestKitDurableStateStoreProvider"
}
