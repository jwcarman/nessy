spring:
  application:
    name: chat-web
  threads:
    virtual:
      enabled: true
  datasource:
    # Where the database is when it is not the compose file's: `spring-boot:run` starts the
    # containers beside this pom and takes the URL, user and password from them, so these defaults
    # are for running the jar against a database somebody else started.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nessy}
    username: ${SPRING_DATASOURCE_USERNAME:nessy}
    password: ${SPRING_DATASOURCE_PASSWORD:nessy}

server:
  shutdown: graceful

# Every turn, effect, model call, tool call and background summary is a span; they go to an OTLP
# collector such as grafana/otel-lgtm (docker run -p 3000:3000 -p 4318:4318 grafana/otel-lgtm),
# then Grafana on :3000, Explore, Tempo.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

chat:
  # How many turns make a chapter. A chapter is summarised when it closes, and the summary stands in
  # for its turns from then on. The engine's default is 20; a small number closes one after a few
  # messages.
  chapter-turns: ${CHAT_CHAPTER_TURNS:20}
  # The model that writes a chapter's summary, on the same provider. Blank: the agent's own model.
  summary-model: ${CHAT_SUMMARY_MODEL_ID:}

nessy:
  type: chat
  # Which registered InferenceProvider answers. lmstudio is a preset the starter lights below;
  # nessy.provider names the one this agent type uses.
  provider: ${CHAT_PROVIDER:lmstudio}
  model: ${CHAT_MODEL_ID:qwen/qwen3-coder-30b}
  providers:
    lmstudio:
      enabled: true
      base-url: ${CHAT_MODEL_URL:http://localhost:1234/v1}
  # A FIXED key, so a token minted before a restart can still be read after one. Without this the
  # starter warns and falls back to an ephemeral key, and every waiting approval becomes
  # unanswerable the moment the process bounces. A DEMO key: generate your own for anything real.
  reply-token-encryption-keys:
    - ${CHAT_REPLY_KEY:c2hoLXRoaXMtaXMtYS1kZW1vLWtleS0zMi1ieXRlcyE=}
  system-prompt: |
    You are a helpful assistant in a chat window. Keep answers short unless asked for more.
    When the user tells you something worth keeping -- a preference, a name, a standing fact --
    remember it as a note. Your notes appear as an index in every conversation; read one in
    full with the recall tool when it is relevant, and change one with revise using the id from
    that index. Never invent an id.
    For work that takes several steps, write a plan with the update_plan tool and keep it
    current as you go. The plan you are holding appears in every message.
    When a question turns on today's date or on counting days, use the days_until tool rather
    than working it out yourself.
    You can also send email, but every send is shown to a person for approval before it
    happens. So say what you are about to send, send it, and expect the result to arrive
    later -- possibly much later. Never claim an email has been sent until the tool says so.
