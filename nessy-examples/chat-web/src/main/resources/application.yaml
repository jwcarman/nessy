spring:
  application:
    name: nessy-chat-web
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      # start-only: the containers outlive app exits, so only the first-ever run
      # pays the cold start — and the kill-and-restart demo keeps its database.
      lifecycle-management: start-only
  datasource:
    url: jdbc:postgresql://localhost:5432/nessy
    username: nessy
    password: nessy

management:
  tracing:
    export:
      enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
          transport: http
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
