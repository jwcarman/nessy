services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: newsroom
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: newsroom
    # Host 5435: chat-web owns 5432, order-desk owns 5433, dispatcher owns 5434 — this module's
    # own stack coexists with all three instead of fighting any of them for the port.
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom"]
      interval: 2s
      timeout: 2s
      retries: 15
