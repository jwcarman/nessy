<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>watchman — recently answered</title>
  <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; max-width: 70rem; }
    h1 { font-size: 1.2rem; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; vertical-align: top; }
    .action { font-weight: 600; }
  </style>
</head>
<body hx-boost="true">
<h1>watchman — recently answered</h1>
<nav><a th:href="@{/}">waiting</a><a th:href="@{/recent}">recently answered</a></nav>

<p th:if="${rows.isEmpty()}">Nothing has been answered yet.</p>

<table th:unless="${rows.isEmpty()}">
  <thead>
  <tr><th>what was asked</th><th>agent</th><th>answer</th><th>note</th></tr>
  </thead>
  <tbody>
  <tr th:each="row : ${rows}">
    <td class="action" th:text="${row.action}">the command</td>
    <td th:text="${row.agent}">agent</td>
    <td th:text="${row.answer}">answer</td>
    <td th:text="${row.note}">note</td>
  </tr>
  </tbody>
</table>
</body>
</html>
