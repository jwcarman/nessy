spring:
  application:
    name: watchman
  datasource:
    # ONE set of credentials in yaml. PekkoConfigBridge pushes these into Pekko's own Slick pool,
    # which is a second pool against the same database -- see PekkoConfigBridge's javadoc.
    url: ${WATCHMAN_DB_URL:jdbc:postgresql://localhost:5432/watchman?currentSchema=watchman}
    username: ${WATCHMAN_DB_USER:watchman}
    password: ${WATCHMAN_DB_PASSWORD:watchman}
  threads:
    virtual:
      enabled: true
  lifecycle:
    # How long Spring waits for WatchmanActorSystem#stop to finish draining before it carries on
    # regardless. A wedged actor delays Ctrl-C by this much and then the JVM exits anyway.
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

nessy:
  # LM Studio speaks the OpenAI wire, so semconv's value for it is openai. This is configured
  # rather than discovered because a Model no longer reports its own vendor.
  provider: openai
  # A FIXED key, so a token minted before a restart can still be read after one. Without this the
  # starter warns and falls back to an ephemeral key, and every parked approval becomes
  # unanswerable the moment the process bounces.
  reply-token-encryption-keys:
    - ${WATCHMAN_REPLY_KEY:c2hoLXRoaXMtaXMtYS1kZW1vLWtleS0zMi1ieXRlcyE=}

watchman:
  # How often the watchman does its rounds. A fixed RATE, not a cron: rounds are "every so often",
  # and there is nothing about 3am that a watchman cares about.
  #
  # This key used to be `cron`, which nothing read -- WatchmanRounds has always been @Scheduled on
  # ${watchman.round-interval}, and it is not even a field on WatchmanProperties. Every attempt to
  # override the schedule was accepted in silence and ignored, and the app ran the PT30M default
  # while looking perfectly configured.
  round-interval: ${WATCHMAN_ROUND_INTERVAL:PT30M}
  approval-term: 3d
  ask-timeout: 10s
  scripted: ${WATCHMAN_SCRIPTED:false}
  model-url: ${WATCHMAN_MODEL_URL:http://localhost:1234/v1}
  model-id: ${WATCHMAN_MODEL_ID:qwen/qwen3.6-35b-a3b}
  # Older rounds become a paragraph once the transcript passes this; the newest stay verbatim.
  # Drop summarize-after to something small to watch a compression happen instead of waiting.
  summarize-after: ${WATCHMAN_SUMMARIZE_AFTER:60}
  keep-verbatim: ${WATCHMAN_KEEP_VERBATIM:20}
  user: ${WATCHMAN_USER:watchman}
  password: ${WATCHMAN_PASSWORD:watchman}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.apache.pekko: INFO
    org.jwcarman.nessy.engine: DEBUG
    org.jwcarman.nessy.examples.watchman: DEBUG
