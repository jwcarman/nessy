spring:
  application:
    name: watchman
  datasource:
    url: ${WATCHMAN_DB_URL:jdbc:postgresql://localhost:5432/watchman?currentSchema=watchman}
    username: ${WATCHMAN_DB_USER:watchman}
    password: ${WATCHMAN_DB_PASSWORD:watchman}
  threads:
    virtual:
      enabled: true
  lifecycle:
    # How long Spring waits for the engine's own sweeps to stop before it carries on regardless.
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

nessy:
  type: watchman
  # Which registered InferenceProvider answers. lmstudio is a preset the starter lights below;
  # naming scripted instead both selects and creates WatchmanConfiguration's own provider bean
  # (for soaks and tests, with no model behind it) -- the provider choice IS the switch.
  provider: ${WATCHMAN_PROVIDER:lmstudio}
  model: ${WATCHMAN_MODEL_ID:qwen/qwen3-coder-30b}
  providers:
    lmstudio:
      enabled: true
      base-url: ${WATCHMAN_MODEL_URL:http://localhost:1234/v1}

watchman:
  # How often the watchman does its rounds. A fixed RATE, not a cron: rounds are "every so often",
  # and there is nothing about 3am that a watchman cares about.
  round-interval: ${WATCHMAN_ROUND_INTERVAL:PT30M}
  # How long an approval request may wait on the page. When the term runs out, the engine records
  # the call as failed (not authorised); it is not recorded as a denial.
  approval-term: 3d

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.jwcarman.nessy.engine: INFO
    org.jwcarman.nessy.examples.watchman: DEBUG
