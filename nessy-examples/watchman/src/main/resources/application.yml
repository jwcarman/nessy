spring:
  application:
    # The service name every span, metric and log line is tagged with in Grafana.
    name: watchman
  datasource:
    # The durable pair. The starter turns a DataSource plus the two JDBC adapters into a
    # JdbcSubstrate and a JdbcContinuumRepository; without it, the watchman forgets everything it
    # was waiting for the moment it restarts, which is the one thing the soak is measuring.
    url: ${WATCHMAN_DB_URL:jdbc:postgresql://localhost:5432/watchman}
    username: ${WATCHMAN_DB_USER:watchman}
    password: ${WATCHMAN_DB_PASSWORD:watchman}
  threads:
    virtual:
      enabled: true

nessy:
  type: watchman
  # A prompt this long belongs in a file, not a properties value.
  system-prompt-file: classpath:system-prompt.md
  # The re-fire policy. Deliberately long: a round that is genuinely waiting on a human should not
  # be re-driven every five minutes for three days. The counter that would show that going wrong is
  # nessy.state.stale_retries CLIMBING WHILE NO ROUND IS OPEN; a healthy round with several calls in
  # flight produces retries in proportion to that parallelism and is not a symptom (README, F3).
  staleness: 30m
  backlog-capacity: 256
  # The soak's cache case. Every round resends the same system prompt and the same tool schemas,
  # every thirty minutes, forever — which is exactly what a provider-side prompt cache is for. This
  # asks; a provider that cannot do it says so and nothing fails. Whether it worked shows up as
  # gen_ai.usage.cache_read.input_tokens on the chat span, against cache_write on the round that
  # populated it.
  capabilities:
    - prompt-caching

watchman:
  # Every half hour, on the half hour.
  cron: ${WATCHMAN_CRON:0 */30 * * * *}
  scheduling:
    enabled: true
  notes-dir: ${WATCHMAN_NOTES_DIR:./notes}
  note-history: 3
  command-timeout: 30s
  # Package upgrades get minutes, not seconds. The timeout is enforced by destroying the process, so
  # thirty seconds on `apt-get -y upgrade` is a SIGKILL to dpkg mid-transaction — a half-configured
  # package database on a real server. A kernel upgrade over a slow link genuinely takes minutes.
  upgrade-timeout: 15m
  # No defaults, on purpose (see WatchmanProperties): the application refuses to start without
  # them rather than shipping a password.
  user: ${WATCHMAN_USER:}
  password: ${WATCHMAN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    # Metrics kept the management.otlp.* prefix in Boot 4.1; traces and logs did not (below).
    metrics:
      export:
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 30s
  # Boot 4.1 moved OTLP TRACES and LOGS to management.opentelemetry.<signal>.export.otlp.*. The old
  # management.otlp.tracing.endpoint still appears in the configuration metadata, but the condition
  # that creates the exporter's connection details reads only the new name — so the old spelling
  # binds to nothing, no SpanExporter or LogRecordExporter bean is created, and nothing complains.
  # Verified against the condition-evaluation report, not from memory; TelemetryWiringTest asserts
  # the exporter beans exist so this cannot rot silently.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
    # Its own override, not a share of the tracing one. Without this an operator who points
    # OTLP_TRACES_URL at a remote collector silently keeps shipping logs to localhost:4318 and
    # cannot tell, because a failing exporter drops rather than throws.
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGS_URL:http://localhost:4318/v1/logs}
  tracing:
    sampling:
      # A round every half hour is not a traffic problem. Sample all of it: the interesting round is
      # always the rare one, and 10% sampling is how you lose it.
      probability: 1.0

logging:
  level:
    org.jwcarman.nessy: INFO
    org.jwcarman.nessy.examples.watchman: DEBUG
