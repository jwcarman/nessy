spring:
  application:
    name: watchman
  datasource:
    url: ${WATCHMAN_DB_URL:jdbc:postgresql://localhost:5432/watchman?currentSchema=watchman}
    username: ${WATCHMAN_DB_USER:watchman}
    password: ${WATCHMAN_DB_PASSWORD:watchman}
  threads:
    virtual:
      enabled: true
  lifecycle:
    # How long Spring waits for the engine's own sweeps to stop before it carries on regardless.
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

nessy:
  type: watchman
  # LM Studio speaks the OpenAI wire, so semconv's value for it is openai. This is configured
  # rather than discovered because a provider does not report its own vendor.
  provider: openai
  model: ${WATCHMAN_MODEL_ID:qwen/qwen3.6-35b-a3b}
  # A FIXED key, so a token minted before a restart can still be read after one. Without this the
  # starter warns and falls back to an ephemeral key, and every parked approval becomes
  # unanswerable the moment the process bounces.
  reply-token-encryption-keys:
    - ${WATCHMAN_REPLY_KEY:c2hoLXRoaXMtaXMtYS1kZW1vLWtleS0zMi1ieXRlcyE=}

# The OpenAI adapter's own auto-configuration reads these; a base URL points it at LM Studio. It
# stands down when watchman.scripted is on, because the application then declares a provider.
openai:
  api-key: ${WATCHMAN_MODEL_API_KEY:lm-studio}
  base-url: ${WATCHMAN_MODEL_URL:http://localhost:1234/v1}

watchman:
  # How often the watchman does its rounds. A fixed RATE, not a cron: rounds are "every so often",
  # and there is nothing about 3am that a watchman cares about.
  round-interval: ${WATCHMAN_ROUND_INTERVAL:PT30M}
  # How long a question may wait on the board before the engine denies it on the person's behalf.
  approval-term: 3d
  scripted: ${WATCHMAN_SCRIPTED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.jwcarman.nessy.engine: DEBUG
    org.jwcarman.nessy.examples.watchman: DEBUG
