# What watchman adds to the starter's own reference.conf.
#
# NOT here any more, because the starter provides them: the cluster provider, the
# artery defaults, and the StateSerializer bindings for AgentState and TurnState.
# This file is only what is watchman's own choice.
#
# What is NOT here either: the database. Spring owns that (spring.datasource.*) and
# PekkoConfigBridge pushes the three values across, because pekko-persistence-jdbc
# builds its own pool from HOCON and has no way to accept a DataSource that exists.

pekko {
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  coordinated-shutdown.run-by-jvm-shutdown-hook = off

  # The durable-state plugin the engine keeps agent and turn state in. The starter
  # deliberately picks none, because there is no right default; this application runs
  # Postgres, so it picks the JDBC one.
  persistence {
    journal.plugin = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
    state.plugin = "jdbc-durable-state-store"
  }
}

jdbc-journal.use-shared-db = "watchman"
jdbc-snapshot-store.use-shared-db = "watchman"
jdbc-durable-state-store.use-shared-db = "watchman"

# The second pool, against the same database. Its url, user and password are pushed in
# by PekkoConfigBridge, so they are written in exactly one place: application.yml.
pekko-persistence-jdbc {
  shared-databases {
    watchman {
      profile = "slick.jdbc.PostgresProfile$"
      db {
        connectionPool = "HikariCP"
        driver = "org.postgresql.Driver"
        numThreads = 5
        maxConnections = 5
        minConnections = 1
      }
    }
  }
}
