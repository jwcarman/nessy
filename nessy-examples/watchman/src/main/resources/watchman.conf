# Everything Pekko-shaped, in HOCON where HOCON's includes and substitutions actually work.
#
# What is NOT here: the database. Spring owns that (spring.datasource.*) and PekkoConfigBridge
# pushes the three values across, because pekko-persistence-jdbc builds its own pool from HOCON and
# has no way to accept a javax.sql.DataSource that already exists.

pekko {
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    # Single node. No cluster, no remoting to configure, no split-brain policy to choose.
    provider = "local"

    serializers {
      # Ours. pekko-serialization-jackson is not on this application's classpath at all, which is
      # what keeps Pekko from having an opinion about the jackson-databind version Spring uses.
      watchman-state = "org.jwcarman.nessy.engine.StateSerializer"
    }

    serialization-bindings {
      "org.jwcarman.nessy.engine.AgentState" = watchman-state
    }
  }

  # SPRING OWNS SHUTDOWN. By default Pekko installs its own JVM shutdown hook, and Spring Boot
  # installs one too -- two hooks with no ordering between them, so Pekko can terminate the system
  # while Spring is still stopping beans. The symptom is dead letters and lost work on a clean
  # Ctrl-C. Turning this off makes WatchmanActorSystem#stop the single path out.
  coordinated-shutdown.run-by-jvm-shutdown-hook = off

  persistence {
    journal.plugin = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
    state.plugin = "jdbc-durable-state-store"
  }
}

jdbc-journal.use-shared-db = "watchman"
jdbc-snapshot-store.use-shared-db = "watchman"
jdbc-durable-state-store.use-shared-db = "watchman"

pekko-persistence-jdbc {
  shared-databases {
    watchman {
      profile = "slick.jdbc.PostgresProfile$"
      db {
        connectionPool = "HikariCP"
        driver = "org.postgresql.Driver"
        # url, user and password arrive from application.yml via PekkoConfigBridge.
        numThreads = 5
        maxConnections = 5
        minConnections = 1
      }
    }
  }
}
