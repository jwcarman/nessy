# The flow tests: same actors, same serializer, no Postgres and no Docker.
include "watchman"

pekko.persistence {
  journal.plugin = "pekko.persistence.testkit.journal"
  snapshot-store.plugin = "pekko.persistence.testkit.snapshotstore"
  state.plugin = "pekko.persistence.testkit.state"
}
pekko.persistence.testkit.journal {
  class = "org.apache.pekko.persistence.testkit.PersistenceTestKitPlugin"
}
pekko.persistence.testkit.snapshotstore {
  class = "org.apache.pekko.persistence.testkit.PersistenceTestKitSnapshotPlugin"
}

# Agents are sharded entities, which is what guarantees exactly one instance per (agent type,
# agent id) and makes it irrelevant how many harnesses exist. Sharding needs a cluster, and one
# node is a cluster.
pekko.actor.provider = cluster
pekko.remote.artery.canonical.hostname = "127.0.0.1"
pekko.remote.artery.canonical.port = 0
pekko.cluster.jmx.multi-mbeans-in-same-jvm = on
pekko.cluster.downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
