# The two things the watchman needs that are not the watchman.
#
# The application itself is NOT here, and that is deliberate (spec §2.4): it needs df, systemctl,
# docker and the journal of the REAL host, so it runs on the box with `java -jar`, not in a
# container that would only ever see its own filesystem.
services:
  postgres:
    image: postgres:17
    container_name: watchman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: watchman
      POSTGRES_USER: watchman
      POSTGRES_PASSWORD: watchman
    ports:
      - "5432:5432"
    volumes:
      - watchman-db:/var/lib/postgresql/data
      # Runs once, on first start of an empty volume: the schema this application is configured to
      # use, and Pekko's tables, neither of which anything else creates. Without it a clone-and-run
      # starts cleanly and then dies on its first round.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchman"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana's own all-in-one: Grafana, Prometheus, Tempo and Loki behind one OTLP endpoint. One
  # container is the right size for a home server, and it is the same box the README's dashboards
  # assume.
  lgtm:
    image: grafana/otel-lgtm
    container_name: watchman-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000"   # Grafana — the thing you actually look at
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP — what application.yml's management.otlp.* point at
    volumes:
      - watchman-lgtm:/data

volumes:
  watchman-db:
  watchman-lgtm:
