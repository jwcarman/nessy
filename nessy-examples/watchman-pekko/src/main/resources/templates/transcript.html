<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>watchman (pekko) — the notes</title>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; max-width: 70rem; }
    h1 { font-size: 1.2rem; }
    nav a { margin-right: 1rem; }
    td { vertical-align: top; padding: .35rem .6rem; border-bottom: 1px solid #eee; }
    .role { white-space: nowrap; color: #666; }
    pre { white-space: pre-wrap; margin: 0; }
  </style>
</head>
<body>
<h1>watchman (pekko) — the notes</h1>
<nav><a th:href="@{/}">waiting</a><a th:href="@{/transcript}">the notes</a></nav>
<table>
  <tr th:each="note : ${notes}">
    <td class="role" th:text="${note.role}">role</td>
    <td><pre th:text="${note.text}">text</pre></td>
  </tr>
</table>
</body>
</html>
