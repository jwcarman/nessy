# The flow tests: same actors, same serializer, no Postgres and no Docker.
include "watchman-pekko"

pekko.persistence {
  journal.plugin = "pekko.persistence.testkit.journal"
  snapshot-store.plugin = "pekko.persistence.testkit.snapshotstore"
  state.plugin = "pekko.persistence.testkit.state"
}
pekko.persistence.testkit.journal {
  class = "org.apache.pekko.persistence.testkit.PersistenceTestKitPlugin"
}
pekko.persistence.testkit.snapshotstore {
  class = "org.apache.pekko.persistence.testkit.PersistenceTestKitSnapshotPlugin"
}
