# The one thing this example needs that is not this example: somewhere for the notebook, the
# plan and the conversation to live. Started and stopped by Boot, so running the example is the whole ceremony -- there
# is nothing to bring up first and no connection details to export.
#
# The notebook, the plan and the conversation all live in here.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nessy
      POSTGRES_USER: nessy
      POSTGRES_PASSWORD: nessy
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessy -d nessy"]
      interval: 2s
      timeout: 3s
      retries: 20
